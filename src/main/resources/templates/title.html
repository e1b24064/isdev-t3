<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>タイトル画面</title>
</head>

<body>
  <main>
    <h1>タイトル画面</h1>
    <p>ログイン中: <span th:text="${username}">ユーザー名</span></p>

    <div th:if="${role == 'ADMIN'}">
      <details>
        <summary>部屋を作成</summary>
        <form action="/rooms/create" method="post">
          <button type="submit" name="mode" value="INDIVIDUAL">個人戦</button>
          <button type="submit" name="mode" value="TEAM">チーム戦</button>
        </form>
      </details>
    </div>

    <div th:if="${role == 'PARTICIPANT'}">
      <h2>部屋に参加</h2>
      <form action="/rooms/join" method="post">
        <label for="roomId">部屋ID</label>
        <input id="roomId" name="roomId" type="number" min="1" required>
        <button type="submit">参加</button>
      </form>
    </div>

  </main>
</body>

</html>
