<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>ルーム画面</title>
</head>

<body>
  <main>
    <h1>ルーム画面</h1>
    <p>部屋ID: <span th:text="${room.id}">0</span></p>
    <p>モード: <span th:text="${room.mode == 'INDIVIDUAL' ? '個人戦' : 'チーム戦'}">モード</span></p>
    <p>作成者: <span th:text="${room.owner}">作成者</span></p>

    <p th:if="${joinError != null}" th:text="${joinError}"></p>

    <h2>参加者</h2>
    <ul id="participant-list" th:attr="data-room-id=${room.id}">
      <li th:each="participant : ${room.participants}" th:text="${participant}">参加者</li>
    </ul>

    <div th:if="${role == 'PARTICIPANT'}">
      <h2>同じチームを希望する相手</h2>
      <form th:action="@{/rooms/{roomId}/preference(roomId=${room.id})}" method="post">
        <select name="preferredUsername" required>
          <option th:each="p : ${room.participants}" th:if="${p != username}" th:value="${p}" th:text="${p}"></option>
        </select>
        <button type="submit">希望を送信</button>
      </form>
    </div>

    <div th:if="${isAdmin}">
      <form th:action="@{/rooms/{roomId}/assign-teams(roomId=${room.id})}" method="post">
        <button type="submit">チーム編成</button>
      </form>
    </div>

    <div th:if="${!teams.isEmpty()}">
      <h2>チーム編成結果</h2>
      <div th:each="entry : ${teams}">
        <h3 th:text="'チーム ' + ${entry.key}"></h3>
        <ul>
          <li th:each="member : ${entry.value}" th:text="${member}"></li>
        </ul>
      </div>
    </div>

    <div th:if="${isAdmin}">
      <button type="button">ゲーム開始</button>
    </div>

    <form th:if="${role == 'PARTICIPANT'}" th:action="@{/rooms/{roomId}/leave(roomId=${room.id})}" method="post">
      <button type="submit">ルームから退出</button>
    </form>
  </main>
  <script>
    const participantList = document.getElementById("participant-list");
    const roomId = participantList.dataset.roomId;

    async function refreshParticipants() {
      try {
        const response = await fetch(`/rooms/${roomId}/participants`);
        if (!response.ok) {
          return;
        }

        const participants = await response.json();
        participantList.replaceChildren(...participants.map((username) => {
          const item = document.createElement("li");
          item.textContent = username;
          return item;
        }));
      } catch (error) {
        console.error("参加者一覧の更新に失敗しました。", error);
      }
    }

    refreshParticipants();
    window.setInterval(refreshParticipants, 3000);
  </script>
</body>

</html>
